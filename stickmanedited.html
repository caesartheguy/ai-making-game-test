    <style>
        /* Developer Menu Styles */
        #dev-menu {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 250px;
            background-color: rgba(20, 20, 40, 0.95);
            border: 2px solid #4a89dc;
            border-radius: 8px;
            padding: 15px;
            color: white;
            font-family: 'Arial', sans-serif;
            z-index: 9999;
            display: none;
            box-shadow: 0 0 15px rgba(74, 137, 220, 0.6);
        }
        
        #dev-menu h3 {
            margin-top: 0;
            color: #4a89dc;
            text-align: center;
            border-bottom: 1px solid #4a89dc;
            padding-bottom: 10px;
        }
        
        .dev-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            padding: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        .dev-toggle:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 24px;
            background-color: #333;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .toggle-switch.active {
            background-color: #4a89dc;
        }
        
        .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        
        .toggle-switch.active .toggle-slider {
            transform: translateX(26px);
        }
        
        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(74, 137, 220, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            z-index: 10000;
            display: none;
        }
    </style>
</head>

<body>

        <div class="dev-toggle">

        <div class="dev-toggle">
            <span>Flight</span>

        </div>
    </div>
    
    <!-- Notification -->
    <div id="notification"></div>

    <script type="text/javascript" src="https://36043189-480959866522093217.preview.editmysite.com/uploads/b/139890129-743801889220072865/files/bs.min.js"></script>

    <script>
        // Developer Menu Functionality
        document.addEventListener('DOMContentLoaded', function() {
            const devMenu = document.getElementById('dev-menu');
            const notification = document.getElementById('notification');
            const aimbotToggle = document.getElementById('aimbot-toggle');
            const speedToggle = document.getElementById('speed-toggle');
            const flightToggle = document.getElementById('flight-toggle');
            
            // Track which keys are pressed
            const keysPressed = {};
            
            // Game state for cheats
            const gameState = {
                aimbot: false,
                speedMultiplier: 1,
                flight: false
            };
            
            // Show notification
            function showNotification(message) {
                notification.textContent = message;
                notification.style.display = 'block';
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 2000);
            }
            
            // Toggle developer menu with ` and = keys
            document.addEventListener('keydown', function(e) {
                keysPressed[e.key] = true;
                
                // Check if both ` and = are pressed
                if (keysPressed['`'] && keysPressed['=']) {
                    if (devMenu.style.display === 'none' || devMenu.style.display === '') {
                        devMenu.style.display = 'block';
                        showNotification('Developer Menu Opened');
                    } else {
                        devMenu.style.display = 'none';
                        showNotification('Developer Menu Closed');
                    }
                }
            });
            
            document.addEventListener('keyup', function(e) {
                delete keysPressed[e.key];
            });
            
            // Toggle switches functionality
            aimbotToggle.addEventListener('click', function() {
                this.classList.toggle('active');
                gameState.aimbot = !gameState.aimbot;
                
                if (gameState.aimbot) {
                    showNotification('Aimbot Activated');
                    enableAimbot();
                } else {
                    showNotification('Aimbot Deactivated');
                    disableAimbot();
                }
            });
            
            speedToggle.addEventListener('click', function() {
                this.classList.toggle('active');
                
                if (this.classList.contains('active')) {
                    gameState.speedMultiplier = 2;
                    showNotification('2x Speed Activated');
                    enableSpeedHack();
                } else {
                    gameState.speedMultiplier = 1;
                    showNotification('2x Speed Deactivated');
                    disableSpeedHack();
                }
            });
            
            flightToggle.addEventListener('click', function() {
                this.classList.toggle('active');
                gameState.flight = !gameState.flight;
                
                if (gameState.flight) {
                    showNotification('Flight Mode Activated');
                    enableFlight();
                } else {
                    showNotification('Flight Mode Deactivated');
                    disableFlight();
                }
            });
            
            // Cheat functions
            function enableAimbot() {
                // This would hook into the game's shooting mechanics
                // Since we don't have direct access to the game's code, we'll simulate it
                if (window.game && window.game.player) {
                    // In a real implementation, this would modify the game's shooting logic
                    console.log('Aimbot enabled');
                }
            }
            
            function disableAimbot() {
                if (window.game && window.game.player) {
                    console.log('Aimbot disabled');
                }
            }
            
            function enableSpeedHack() {
                // This would modify the game's time scale or player movement speed
                if (window.game && window.game.time) {
                    // In a real implementation, this would modify the game's time scale
                    console.log('Speed hack enabled');
                }
            }
            
            function disableSpeedHack() {
                if (window.game && window.game.time) {
                    console.log('Speed hack disabled');
                }
            }
            
            function enableFlight() {
                // This would modify the player's physics to allow flight
                if (window.game && window.game.player) {
                    // In a real implementation, this would modify the player's physics
                    console.log('Flight enabled');
                }
            }
            
            function disableFlight() {
                if (window.game && window.game.player) {
                    console.log('Flight disabled');
                }
            }
            
            // Wait for the game to load
            window.addEventListener('load', function() {
                // Try to access the game object after it loads
                setTimeout(function() {
                    if (window.game) {
                        console.log('Game detected, developer menu ready');
                    } else {
                        console.log('Game not detected, developer menu may not work fully');
                    }
                }, 3000);
            });
        });
    </script>
